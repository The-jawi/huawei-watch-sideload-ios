# The Xcode project is generated with XcodeGen: ./generate.sh (uses the team and bundle ID from Config/local.env)
name: HuaSideload
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${HUASIDELOAD_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  HuaSideload:
    type: application
    platform: iOS
    sources:
      - path: HuaSideload
        excludes: ["Info.plist"]
      # Output of tools/build-watch-app.sh: the app lists these under "Watch apps"
      - path: WatchApps
        optional: true
        buildPhase: resources
        includes: ["*.bin"]
      # Watch face packages (.hwt): the app lists these under "Watch faces"
      - path: WatchFaces
        optional: true
        buildPhase: resources
        includes: ["*.hwt"]
    info:
      path: HuaSideload/Info.plist
      properties:
        CFBundleDisplayName: HuaSideload
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSBluetoothAlwaysUsageDescription: Needed to connect to your Huawei watch over Bluetooth.
        # voip: the watch speaker rings the watch with a CallKit call (refused without it); audio: keeps it playing when locked
        UIBackgroundModes: [bluetooth-central, audio, voip]
        UILaunchScreen: {}
        # .hwt watch faces: "Open in…" / share sheet from Files hand a copy to the app (Documents/Inbox), which
        # FaceLibrary copies into Application Support and removes
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Huawei watch face
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.huasideload.hwt]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.huasideload.hwt
            UTTypeDescription: Huawei watch face
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [hwt]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${HUASIDELOAD_BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
